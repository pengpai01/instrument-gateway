server:
  port: 8080

spring:
  application:
    name: instrument-gateway
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    # Box / no profile: localhost:9092 (docker compose). Optional env override.
    # Laptop intranet broker: profile `laptop` → 192.168.11.114:9092 (application-laptop.yml).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # Admin client used for topic auto-create + actuator health
    admin:
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

gateway:
  # Prefer env GATEWAY_API_KEY. Do not commit real production secrets.
  api-key: ${GATEWAY_API_KEY:}
  # Optional key -> clientId map. One key per instrument gives every client a stable sourceId
  # even when the firmware cannot report a deviceId. Keys must not contain a dot.
  #   clients:
  #     krd-lab-key-01: krd-lab-01
  clients: {}
  kafka:
    topic: instr.event.v1
    auto-create-topic: true
    partitions: 1
    replication-factor: 1
  tcp:
    enabled: true
    host: 0.0.0.0
    port: 9100
    max-frame-bytes: 1024
    # Records larger than one frame arrive as msgId/seq/total envelopes and are merged here.
    # max-bytes applies to the assembled record, not to a single frame.
    assembly:
      enabled: true
      max-bytes: 65536
      # 128 fragments x ~700 raw bytes/frame covers the 64KB record limit
      max-fragments: 128
      timeout-ms: 10000
      max-pending-per-channel: 8
    # Connection-level auth: every connection must open with one {"type":"AUTH","token":"..."}
    # frame before any record is accepted.
    auth:
      handshake-timeout-ms: 5000
      max-failures-per-connection: 5
      max-token-length: 256
      session-ttl-seconds: 3600       # 0 = never expire
  mqtt:
    # Empty = MQTT disabled; process still starts. Set via local profile / env.
    broker-url: ${GATEWAY_MQTT_BROKER_URL:}
    username: ${GATEWAY_MQTT_USERNAME:}
    password: ${GATEWAY_MQTT_PASSWORD:}
    topic-filter: instr/+/up
    qos: 1
    client-id-prefix: gw-

logging:
  level:
    com.danah.instrument.gateway: INFO
    org.springframework.kafka: WARN
